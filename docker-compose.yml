services:
  incident-service:
    build: .
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incidentdb
      DB_USERNAME: incident
      DB_PASSWORD: incident
      JWT_SECRET: local-dev-secret-change-me-local-dev-secret
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidentdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5433:5432"
    volumes:
      - incident_pg_data:/var/lib/postgresql/data

volumes:
  incident_pg_data:
