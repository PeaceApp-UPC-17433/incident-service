server:
  port: 8082
  shutdown: graceful

spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: incident-service
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

incident:
  messaging:
    exchange: ${EVENTS_EXCHANGE:peaceapp.events}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_MS:1000}
  edit-window-minutes: ${EDIT_WINDOW_MINUTES:30}
  max-evidence-size-bytes: ${MAX_EVIDENCE_SIZE_BYTES:26214400}
  evidence:
    storage:
      account: ${EVIDENCE_STORAGE_ACCOUNT:}
      key: ${EVIDENCE_STORAGE_KEY:}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{userId:-}]"
