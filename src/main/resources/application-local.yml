spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/incident_db}
    username: ${DB_USERNAME:incident}
    password: ${DB_PASSWORD:incident}
  flyway:
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:peaceapp}
    password: ${RABBIT_PASSWORD:peaceapp}

logging:
  level:
    pe.upc.peaceapp: DEBUG
